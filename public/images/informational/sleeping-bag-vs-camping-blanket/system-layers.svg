<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Camp sleep system layers</title><desc id="desc">Diagram showing shelter, top insulation, sleeper, sleeping pad, and ground.</desc><rect width="1200" height="720" fill="#f7f4ec"/><text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#173b2c">Warmth is a system</text><g font-family="Arial" text-anchor="middle"><path d="M170 250L600 110l430 140" fill="none" stroke="#557565" stroke-width="18" stroke-linecap="round"/><text x="600" y="160" font-size="23" fill="#173b2c">Shelter controls wind and moisture</text><rect x="250" y="250" width="700" height="100" rx="50" fill="#e59e54"/><text x="600" y="310" font-size="26" font-weight="700" fill="#492e16">Bag or blanket traps air above you</text><rect x="330" y="374" width="540" height="70" rx="35" fill="#e9c9a2"/><text x="600" y="418" font-size="23" fill="#492e16">Dry sleep clothing</text><rect x="225" y="470" width="750" height="90" rx="24" fill="#92b7a1"/><text x="600" y="525" font-size="26" font-weight="700" fill="#173b2c">Pad resists heat loss to the ground</text><rect x="100" y="590" width="1000" height="70" rx="15" fill="#695845"/><text x="600" y="635" font-size="24" fill="white">Level, dry campsite</text></g></svg>

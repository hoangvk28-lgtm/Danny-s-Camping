<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Sleeping bag versus quilt priorities</title><desc id="desc">Comparison of draft tolerance, weight priority, movement, and simplicity.</desc><rect width="1200" height="720" fill="#f7f4ec"/><text x="600" y="62" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173b2c">Match the system to your priorities</text><g font-family="Arial"><text x="570" y="125" text-anchor="end" font-size="26" font-weight="700" fill="#173b2c">Sleeping bag</text><text x="630" y="125" font-size="26" font-weight="700" fill="#9b5b23">Quilt</text><line x1="600" y1="145" x2="600" y2="640" stroke="#b9b0a0" stroke-width="3"/><g font-size="22"><text x="570" y="205" text-anchor="end">Simple sealed enclosure</text><text x="630" y="205">Lower weight potential</text><text x="570" y="295" text-anchor="end">Hood surrounds the head</text><text x="630" y="295">More room to move</text><text x="570" y="385" text-anchor="end">Forgiving of small gaps</text><text x="630" y="385">Fine control with straps</text><text x="570" y="475" text-anchor="end">Familiar zipper venting</text><text x="630" y="475">No insulation trapped below</text><text x="570" y="565" text-anchor="end">Better for restless drafts</text><text x="630" y="565">Best with a warm pad</text></g><circle cx="600" cy="200" r="10" fill="#668b77"/><circle cx="600" cy="290" r="10" fill="#d19455"/><circle cx="600" cy="380" r="10" fill="#668b77"/><circle cx="600" cy="470" r="10" fill="#d19455"/><circle cx="600" cy="560" r="10" fill="#668b77"/></g></svg>

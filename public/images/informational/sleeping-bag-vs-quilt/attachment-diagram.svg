<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">How quilt pad straps control drafts</title><desc id="desc">Cross section comparing loose and correctly tensioned quilt straps.</desc><rect width="1200" height="720" fill="#f6f3ea"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173b2c">Quilt attachment: seal without squeezing</text><g font-family="Arial"><text x="300" y="125" text-anchor="middle" font-size="26" font-weight="700" fill="#9b4a31">Too loose</text><path d="M80 340Q300 90 520 340" fill="none" stroke="#d8884e" stroke-width="55"/><ellipse cx="300" cy="385" rx="150" ry="65" fill="#e7c29a"/><rect x="65" y="480" width="470" height="80" rx="35" fill="#85aa98"/><path d="M125 440v60M475 440v60" stroke="#9b4a31" stroke-width="8" stroke-dasharray="12 10"/><text x="300" y="615" text-anchor="middle" font-size="21" fill="#5b4338">Open edges pump warm air out</text><text x="900" y="125" text-anchor="middle" font-size="26" font-weight="700" fill="#173b2c">Correctly tensioned</text><path d="M680 350Q900 145 1120 350" fill="none" stroke="#d8884e" stroke-width="55"/><ellipse cx="900" cy="385" rx="150" ry="65" fill="#e7c29a"/><rect x="665" y="480" width="470" height="80" rx="35" fill="#85aa98"/><path d="M730 370Q730 455 745 495M1070 370Q1070 455 1055 495" fill="none" stroke="#173b2c" stroke-width="8"/><text x="900" y="615" text-anchor="middle" font-size="21" fill="#33483d">Edges follow the body; loft stays uncompressed</text></g></svg>

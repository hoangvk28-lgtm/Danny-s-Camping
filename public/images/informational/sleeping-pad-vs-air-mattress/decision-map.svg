<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Sleeping pad or air mattress decision map</title><desc id="d">Decision flow based on insulation, transport, and sleeping space.</desc><rect width="1200" height="720" fill="#f7f4ec"/><g font-family="Arial" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700" fill="#173b2c">Which surface fits the trip?</text><rect x="390" y="115" width="420" height="95" rx="18" fill="#173b2c"/><text x="600" y="155" fill="white" font-size="22">Will you carry it far</text><text x="600" y="184" fill="white" font-size="22">or camp in cool weather?</text><path d="M490 210v70H260v55M710 210v70h230v55" fill="none" stroke="#668b77" stroke-width="6"/><text x="430" y="266" fill="#173b2c" font-size="20">YES</text><text x="770" y="266" fill="#173b2c" font-size="20">NO</text><rect x="65" y="335" width="390" height="120" rx="18" fill="#cfe1d6"/><text x="260" y="383" font-size="27" font-weight="700" fill="#173b2c">Camping sleeping pad</text><text x="260" y="420" font-size="19" fill="#33483d">Published R-value, compact system</text><rect x="745" y="335" width="390" height="120" rx="18" fill="#efd2a6"/><text x="940" y="380" font-size="25" font-weight="700" fill="#663e16">Need bed-like height</text><text x="940" y="417" font-size="19" fill="#663e16">and have ample tent space?</text><path d="M940 455v72" stroke="#9b6529" stroke-width="6"/><rect x="745" y="527" width="390" height="120" rx="18" fill="#e7bc7d"/><text x="940" y="575" font-size="27" font-weight="700" fill="#663e16">Air mattress</text><text x="940" y="612" font-size="19" fill="#663e16">Verify warmth, fit, pump, and backup</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Insulated pad versus uninsulated air mattress heat flow</title><desc id="d">Diagram showing reduced heat flow through an insulated camping pad and greater circulation in a large air chamber.</desc><rect width="1200" height="720" fill="#f6f3ea"/><g font-family="Arial" text-anchor="middle"><text x="600" y="64" font-size="36" font-weight="700" fill="#173b2c">Thickness does not equal insulation</text><text x="300" y="125" font-size="26" font-weight="700" fill="#173b2c">Insulated camping pad</text><ellipse cx="300" cy="220" rx="180" ry="55" fill="#e8c09a"/><rect x="85" y="300" width="430" height="100" rx="28" fill="#7da790"/><path d="M180 245v45M300 245v45M420 245v45" stroke="#d47745" stroke-width="9"/><text x="300" y="360" fill="white" font-size="22">Internal insulation slows heat flow</text><text x="900" y="125" font-size="26" font-weight="700" fill="#8d5120">Large uninsulated air bed</text><ellipse cx="900" cy="220" rx="180" ry="55" fill="#e8c09a"/><rect x="685" y="285" width="430" height="170" rx="45" fill="#9bb7c0"/><path d="M760 355c80-90 200 90 280 0" fill="none" stroke="#496d78" stroke-width="10"/><path d="M1040 355c-80-90-200 90-280 0" fill="none" stroke="#496d78" stroke-width="10"/><text x="900" y="425" fill="#173b2c" font-size="21">Air can circulate inside the chamber</text><rect x="50" y="515" width="1100" height="90" rx="20" fill="#6b5947"/><text x="600" y="570" fill="white" font-size="27">Cold ground receives heat unless the system resists its flow</text></g></svg>

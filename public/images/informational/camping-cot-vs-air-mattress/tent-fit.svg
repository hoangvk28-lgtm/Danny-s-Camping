<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Tent clearance for a cot and an air mattress</title><desc id="d">Cross-section showing how raised beds approach sloping tent walls.</desc><rect width="1200" height="720" fill="#f6f3ea"/><g font-family="Arial" text-anchor="middle"><text x="600" y="65" font-size="36" font-weight="700" fill="#173b2c">Measure usable space at bed height</text><path d="M70 590L300 135l230 455M670 590l230-455 230 455" fill="none" stroke="#628774" stroke-width="14"/><line x1="70" y1="590" x2="530" y2="590" stroke="#6b5947" stroke-width="14"/><line x1="670" y1="590" x2="1130" y2="590" stroke="#6b5947" stroke-width="14"/><text x="300" y="115" font-size="24" font-weight="700" fill="#173b2c">Cot</text><rect x="145" y="380" width="310" height="45" rx="15" fill="#d99050"/><path d="M175 425l-35 140M425 425l35 140" stroke="#444" stroke-width="10"/><path d="M135 360h330" stroke="#a54736" stroke-width="6" stroke-dasharray="13 10"/><text x="300" y="330" font-size="18" fill="#8c392c">Wall clearance narrows with height</text><text x="900" y="115" font-size="24" font-weight="700" fill="#173b2c">Air mattress</text><rect x="735" y="440" width="330" height="115" rx="45" fill="#91b3bd"/><path d="M720 420h360" stroke="#a54736" stroke-width="6" stroke-dasharray="13 10"/><text x="900" y="390" font-size="18" fill="#8c392c">Wide sides can contact condensation</text><text x="600" y="665" font-size="23" fill="#33483d">Include frame, bedding, door swing, gear, and a safe exit path</text></g></svg>

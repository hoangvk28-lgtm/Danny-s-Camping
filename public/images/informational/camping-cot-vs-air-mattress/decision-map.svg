<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Camping cot or air mattress decision map</title><desc id="d">Decision flow based on mobility, tent space, couples, and uneven ground.</desc><rect width="1200" height="720" fill="#f7f4ec"/><g font-family="Arial" text-anchor="middle"><text x="600" y="68" font-size="38" font-weight="700" fill="#173b2c">Cot or air mattress?</text><rect x="380" y="115" width="440" height="95" rx="18" fill="#173b2c"/><text x="600" y="155" fill="white" font-size="22">Is easy entry or support over</text><text x="600" y="185" fill="white" font-size="22">slightly uneven ground essential?</text><path d="M490 210v80H270v48M710 210v80h220v48" fill="none" stroke="#648875" stroke-width="6"/><rect x="65" y="338" width="410" height="112" rx="18" fill="#cee0d4"/><text x="270" y="385" font-size="27" font-weight="700" fill="#173b2c">Start with a cot</text><text x="270" y="420" font-size="19" fill="#33483d">Stable height and usable space below</text><rect x="725" y="338" width="410" height="112" rx="18" fill="#efd2a6"/><text x="930" y="382" font-size="25" font-weight="700" fill="#673e14">Sharing one surface?</text><text x="930" y="418" font-size="19" fill="#673e14">Want adjustable plushness?</text><path d="M930 450v75" stroke="#996126" stroke-width="6"/><rect x="725" y="525" width="410" height="112" rx="18" fill="#e6b977"/><text x="930" y="571" font-size="27" font-weight="700" fill="#673e14">Start with an air mattress</text><text x="930" y="607" font-size="19" fill="#673e14">Confirm warmth, pump, and floor fit</text></g></svg>
